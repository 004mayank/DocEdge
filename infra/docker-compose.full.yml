name: docedge

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: docedge
      POSTGRES_PASSWORD: docedge
      POSTGRES_DB: docedge
    # No host port mapping by default (avoids conflicts with local Postgres).
    # If you want host access, add e.g.:
    # ports:
    #   - "5433:5432"
    volumes:
      - docedge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docedge -d docedge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - docedge_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Browser-reachable reverse proxy for MinIO.
  # This makes presigned URLs stable: API signs against http://minio:9000,
  # browser uses http://localhost:9003 (proxy forwards with the correct Host).
  minio-proxy:
    image: nginx:alpine
    ports:
      - "9003:80"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./nginx-minio-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  # One-shot job: create the bucket used by the app.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    # mc returns help/exit 1 if the command chain doesn't execute as expected.
    # We make this idempotent + verbose, and ensure a 0 exit when the bucket
    # already exists.
    command: |
      set -e
      mc alias set local http://minio:9000 minio minio123456
      mc mb -p local/docedge || true
      mc ls local/docedge >/dev/null
      echo "MinIO bucket ensured: docedge"

  api:
    image: docedge-api:dev
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      # Pass secrets/config via --env-file .env (recommended).
      PORT: 3001

      DATABASE_URL: postgres://docedge:docedge@postgres:5432/docedge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Browser clients should upload via the reverse proxy.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9003}
      S3_BUCKET: docedge

      S3_REGION: ap-south-1
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123456
      S3_FORCE_PATH_STYLE: "true"

      JWT_SECRET: ${JWT_SECRET:-replace-with-long-secret}

      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}

      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3002:3001"
    command: ["node", "dist/src/main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    image: docedge-api:dev
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001

      DATABASE_URL: postgres://docedge:docedge@postgres:5432/docedge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9003}
      S3_BUCKET: docedge

      S3_REGION: ap-south-1
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123456
      S3_FORCE_PATH_STYLE: "true"

      JWT_SECRET: ${JWT_SECRET:-replace-with-long-secret}

      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}

      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["node", "dist/src/worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: docedge-web:dev
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Used at Next build-time for the browser bundle
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3002}
    environment:
      # Used at runtime for Next; should be production for `next start`
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3002}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  docedge_pg:
  docedge_minio:
  
